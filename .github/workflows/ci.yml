name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['11.*', '12.*']
        include:
          - laravel: '11.*'
            testbench: '^9.0'
          - laravel: '12.*'
            testbench: '^10.0'

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-

      - name: Pin Laravel ${{ matrix.laravel }} / Testbench ${{ matrix.testbench }}
        run: |
          composer require --no-update --no-interaction \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/cache:${{ matrix.laravel }}"
          composer require --no-update --no-interaction --dev \
            "orchestra/testbench:${{ matrix.testbench }}"

      # v0.6 integration: pin sdk-php to dev-main while sdk-php@v0.6.0
      # is not yet on Packagist. The composer.json constraint stays
      # `"dev-main || ^0.5"`; this step forces resolution to dev-main
      # so prefer-stable can't pick the older v0.5.x release.
      - name: Pin authn-sh/sdk-php to dev-main (v0.6 integration)
        run: composer require --no-update --no-interaction "authn-sh/sdk-php:dev-main"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Lint (Pint)
        run: composer pint

      - name: Static analysis (PHPStan + Larastan)
        run: composer phpstan

      - name: Tests (Pest)
        run: composer test
